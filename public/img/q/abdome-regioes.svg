<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif">
  <title>Divisão do abdome em nove regiões (numeradas)</title>
  <rect width="360" height="420" fill="#ffffff"/>
  <!-- contorno do tronco -->
  <path d="M70 20 Q60 120 62 210 Q60 300 95 400 L265 400 Q300 300 298 210 Q300 120 290 20 Z" fill="#fdf1e7" stroke="#8a6d5a" stroke-width="2"/>
  <!-- rebordos costais -->
  <path d="M80 60 Q130 130 180 95 Q230 130 280 60" fill="none" stroke="#8a6d5a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- umbigo -->
  <circle cx="180" cy="230" r="5" fill="#8a6d5a"/>
  <!-- linhas: hemiclaviculares (verticais) e bicostal / bi-ilíaca (horizontais) -->
  <line x1="130" y1="30" x2="130" y2="395" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="230" y1="30" x2="230" y2="395" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="62" y1="150" x2="298" y2="150" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="62" y1="290" x2="298" y2="290" stroke="#1d4ed8" stroke-width="2"/>
  <!-- números -->
  <g font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="98" y="105">1</text><text x="180" y="130">2</text><text x="262" y="105">3</text>
    <text x="98" y="228">4</text><text x="180" y="262">5</text><text x="262" y="228">6</text>
    <text x="98" y="350">7</text><text x="180" y="350">8</text><text x="262" y="350">9</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="180" y="414">D (direita do paciente) à esquerda da figura · E à direita</text>
  </g>
</svg>
