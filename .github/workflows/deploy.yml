# Publica o Estudo PR no Cloud Run (o mesmo serviço criado pelo Google AI Studio) automaticamente.
#
# - push na main ............................ checa e publica
# - push na branch de trabalho (questoes-pr2) . checa, leva para a main (fast-forward) e publica
#
# Acesso ao Google Cloud sem chaves (Workload Identity Federation), configurado uma vez com
# scripts/configurar-deploy-gcp.sh, que gera o deploy.config.json da raiz (nada nele é secreto).
# Alternativa antiga: secret GCP_SA_KEY + variáveis GCP_PROJECT_ID, GCP_REGION e CLOUD_RUN_SERVICE.
name: Deploy

on:
  push:
    branches: [main, questoes-pr2]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  promote:
    # leva a branch de trabalho para a main depois que a checagem passa
    needs: check
    if: github.ref == 'refs/heads/questoes-pr2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar a main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git checkout -B main origin/main
            git merge --no-edit "$GITHUB_SHA"
            git push origin main
          fi

  deploy:
    needs: [check, promote]
    if: always() && needs.check.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ler configuração
        id: cfg
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          if [ -f deploy.config.json ]; then
            for k in projectId region service workloadIdentityProvider serviceAccount url; do
              echo "$k=$(jq -r ".$k // empty" deploy.config.json)" >> "$GITHUB_OUTPUT"
            done
            echo "modo=wif" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" = "true" ]; then
            echo "projectId=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "region=${{ vars.GCP_REGION }}" >> "$GITHUB_OUTPUT"
            echo "service=${{ vars.CLOUD_RUN_SERVICE }}" >> "$GITHUB_OUTPUT"
            echo "modo=chave" >> "$GITHUB_OUTPUT"
          else
            echo "modo=nenhum" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy automático ainda não configurado: rode scripts/configurar-deploy-gcp.sh no Cloud Shell."
          fi
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.modo == 'wif'
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.workloadIdentityProvider }}
          service_account: ${{ steps.cfg.outputs.serviceAccount }}
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.modo == 'chave'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.modo != 'nenhum'
      - name: Deploy no Cloud Run
        if: steps.cfg.outputs.modo != 'nenhum'
        run: |
          gcloud run deploy "${{ steps.cfg.outputs.service }}" \
            --source . \
            --project "${{ steps.cfg.outputs.projectId }}" \
            --region "${{ steps.cfg.outputs.region }}" \
            --quiet
          URL=$(gcloud run services describe "${{ steps.cfg.outputs.service }}" --project "${{ steps.cfg.outputs.projectId }}" --region "${{ steps.cfg.outputs.region }}" --format='value(status.url)')
          echo "### Publicado: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Conferir se o site respondeu
        if: steps.cfg.outputs.modo != 'nenhum'
        run: |
          URL=$(gcloud run services describe "${{ steps.cfg.outputs.service }}" --project "${{ steps.cfg.outputs.projectId }}" --region "${{ steps.cfg.outputs.region }}" --format='value(status.url)')
          for i in 1 2 3 4 5; do curl -fsS "$URL/api/health" && exit 0; sleep 10; done
          echo "::error::O site não respondeu em $URL/api/health"; exit 1
